<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataPulse Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0a0d14;
    --surface: #111520;
    --surface2: #161b2e;
    --border: #1e2640;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #f59e0b;
    --accent4: #10b981;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #ef4444;
    --glow: 0 0 20px rgba(0, 229, 255, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,13,20,0.8);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.2rem;
    color: var(--accent);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .header-right { display: flex; align-items: center; gap: 16px; }

  .status-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .status-badge.active { color: var(--accent4); }

  /* Upload zone */
  .upload-zone {
    margin: 32px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .upload-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0,229,255,0.05) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .upload-zone:hover::before, .upload-zone.drag-over::before { opacity: 1; }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  .upload-zone.drag-over { background: rgba(0,229,255,0.05); }

  .upload-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    display: block;
    opacity: 0.6;
  }
  .upload-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }
  .upload-sub { color: var(--muted); font-size: 0.9rem; }
  .upload-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .upload-btn:hover {
    background: var(--accent);
    color: var(--bg);
  }
  #file-input { display: none; }

  /* Main dashboard */
  .dashboard { display: none; padding: 0 32px 32px; }
  .dashboard.active { display: block; }

  /* File info bar */
  .file-info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .file-name {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--accent);
  }
  .file-meta { color: var(--muted); font-size: 0.8rem; }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: var(--danger); color: white; }

  /* Filters */
  .filters-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .filters-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .filters-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
  .filter-label { font-size: 0.75rem; color: var(--muted); }
  .filter-select, .filter-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .filter-select:focus, .filter-input:focus { border-color: var(--accent); }
  .apply-btn {
    padding: 9px 24px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .apply-btn:hover { opacity: 0.85; }
  .clear-btn {
    padding: 9px 24px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .clear-btn:hover { border-color: var(--text); color: var(--text); }

  /* Stats cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .stat-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card.c1::after { background: var(--accent); }
  .stat-card.c2::after { background: var(--accent2); }
  .stat-card.c3::after { background: var(--accent3); }
  .stat-card.c4::after { background: var(--accent4); }
  .stat-card.c5::after { background: var(--danger); }

  .stat-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }
  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.8rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-sub { font-size: 0.75rem; color: var(--muted); }

  /* Charts grid */
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .chart-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .chart-pill {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .chart-container { position: relative; height: 240px; }

  /* Column selector */
  .col-select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-family: 'Space Mono', monospace;
    outline: none;
    cursor: pointer;
  }

  /* Data table */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .table-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .table-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .table-count {
    font-size: 0.8rem;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
  }
  .table-scroll { overflow-x: auto; max-height: 360px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--surface2);
    padding: 10px 16px;
    text-align: left;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--accent); }
  tbody tr {
    border-bottom: 1px solid rgba(30,38,64,0.5);
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody td {
    padding: 10px 16px;
    font-size: 0.82rem;
    color: var(--text);
    white-space: nowrap;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sort-indicator { margin-left: 4px; opacity: 0.5; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Animations */
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Responsive */
  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
    header { padding: 16px; }
    .upload-zone, .dashboard { margin: 16px; padding: 16px; }
    .dashboard { padding: 0 16px 16px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      DATAPULSE
    </div>
    <div class="header-right">
      <span class="status-badge" id="status-text">AWAITING DATA</span>
    </div>
  </header>

  <!-- Upload Zone -->
  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept=".csv">
    <span class="upload-icon">📊</span>
    <div class="upload-title">อัปโหลดไฟล์ CSV</div>
    <div class="upload-sub">ลาก &amp; วางไฟล์ที่นี่ หรือคลิกเพื่อเลือกไฟล์</div>
    <div class="upload-sub" style="margin-top:6px;font-size:0.78rem;">รองรับไฟล์ .csv ทุกขนาด</div>
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">เลือกไฟล์</button>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">

    <!-- File info -->
    <div class="file-info-bar fade-in">
      <div>
        <div class="file-name" id="file-name-display"></div>
        <div class="file-meta" id="file-meta-display"></div>
      </div>
      <button class="reset-btn" onclick="resetDashboard()">↩ รีเซ็ต</button>
    </div>

    <!-- Filters -->
    <div class="filters-section fade-in">
      <div class="filters-title">⚡ ตัวกรองข้อมูล</div>
      <div class="filters-grid" id="filters-grid"></div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid"></div>

    <!-- Charts -->
    <div class="charts-grid" id="charts-grid"></div>

    <!-- Table -->
    <div class="table-card fade-in">
      <div class="table-header-bar">
        <div class="table-title">📋 ตารางข้อมูล</div>
        <div class="table-count" id="table-count"></div>
      </div>
      <div class="table-scroll">
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
let rawData = [];
let filteredData = [];
let headers = [];
let numericCols = [];
let categoricalCols = [];
let charts = {};
let sortCol = null;
let sortDir = 1;

// Upload handling
const uploadZone = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.csv')) processFile(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });
uploadZone.addEventListener('click', e => { if (e.target !== document.querySelector('.upload-btn')) fileInput.click(); });

function processFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    parseCSV(text, file.name, file.size);
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text, fileName, fileSize) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return alert('ไฟล์ CSV ต้องมีอย่างน้อย 2 แถว');

  const delimiters = [',', ';', '\t', '|'];
  let delimiter = ',';
  const firstLine = lines[0];
  let maxCount = 0;
  delimiters.forEach(d => {
    const count = (firstLine.match(new RegExp(d === '|' ? '\\|' : d, 'g')) || []).length;
    if (count > maxCount) { maxCount = count; delimiter = d; }
  });

  const parseRow = row => {
    const result = [];
    let inQuote = false, cur = '';
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch === '"') { inQuote = !inQuote; }
      else if (ch === delimiter && !inQuote) { result.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur.trim());
    return result;
  };

  headers = parseRow(lines[0]).map(h => h.replace(/^"|"$/g, ''));
  rawData = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseRow(lines[i]);
    const row = {};
    headers.forEach((h, j) => { row[h] = vals[j] !== undefined ? vals[j].replace(/^"|"$/g, '') : ''; });
    rawData.push(row);
  }

  // Detect column types
  numericCols = [];
  categoricalCols = [];
  headers.forEach(h => {
    const sample = rawData.slice(0, 50).map(r => r[h]).filter(v => v !== '');
    const numCount = sample.filter(v => !isNaN(parseFloat(v)) && v !== '').length;
    if (numCount / sample.length > 0.7) numericCols.push(h);
    else categoricalCols.push(h);
  });

  filteredData = [...rawData];

  document.getElementById('file-name-display').textContent = '📄 ' + fileName;
  document.getElementById('file-meta-display').textContent =
    `${rawData.length.toLocaleString()} แถว · ${headers.length} คอลัมน์ · ${(fileSize/1024).toFixed(1)} KB`;
  document.getElementById('status-text').textContent = 'ACTIVE';
  document.getElementById('status-text').className = 'status-badge active';

  uploadZone.style.display = 'none';
  document.getElementById('dashboard').classList.add('active');

  buildFilters();
  buildStats();
  buildCharts();
  buildTable();
}

function buildFilters() {
  const grid = document.getElementById('filters-grid');
  grid.innerHTML = '';

  // Search
  const sg = document.createElement('div');
  sg.className = 'filter-group';
  sg.innerHTML = `<label class="filter-label">🔍 ค้นหา</label>
    <input class="filter-input" id="search-input" placeholder="ค้นหาทุกคอลัมน์..." style="min-width:200px">`;
  grid.appendChild(sg);

  // Categorical filters (max 3)
  categoricalCols.slice(0, 3).forEach(col => {
    const vals = [...new Set(rawData.map(r => r[col]).filter(v => v !== ''))].sort();
    if (vals.length > 50) return;
    const g = document.createElement('div');
    g.className = 'filter-group';
    g.innerHTML = `<label class="filter-label">${col}</label>
      <select class="filter-select" id="filter-${col}">
        <option value="">ทั้งหมด</option>
        ${vals.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('')}
      </select>`;
    grid.appendChild(g);
  });

  // Numeric range (first numeric col)
  if (numericCols.length > 0) {
    const col = numericCols[0];
    const vals = rawData.map(r => parseFloat(r[col])).filter(v => !isNaN(v));
    const min = Math.min(...vals), max = Math.max(...vals);
    const g = document.createElement('div');
    g.className = 'filter-group';
    g.innerHTML = `<label class="filter-label">${col} (ช่วง)</label>
      <div style="display:flex;gap:6px">
        <input class="filter-input" id="range-min" type="number" placeholder="${min.toFixed(0)}" style="width:80px">
        <input class="filter-input" id="range-max" type="number" placeholder="${max.toFixed(0)}" style="width:80px">
      </div>`;
    grid.appendChild(g);
    grid.dataset.rangeCol = col;
  }

  // Buttons
  const btnG = document.createElement('div');
  btnG.style.cssText = 'display:flex;gap:8px;align-items:flex-end';
  btnG.innerHTML = `<button class="apply-btn" onclick="applyFilters()">ใช้งาน</button>
    <button class="clear-btn" onclick="clearFilters()">ล้าง</button>`;
  grid.appendChild(btnG);
}

function applyFilters() {
  const search = document.getElementById('search-input')?.value.toLowerCase() || '';
  const rangeCol = document.getElementById('filters-grid')?.dataset.rangeCol;
  const rMin = parseFloat(document.getElementById('range-min')?.value);
  const rMax = parseFloat(document.getElementById('range-max')?.value);

  filteredData = rawData.filter(row => {
    // Search
    if (search) {
      const match = headers.some(h => String(row[h]).toLowerCase().includes(search));
      if (!match) return false;
    }
    // Categorical
    for (const col of categoricalCols.slice(0, 3)) {
      const el = document.getElementById('filter-' + col);
      if (el && el.value && row[col] !== el.value) return false;
    }
    // Range
    if (rangeCol) {
      const v = parseFloat(row[rangeCol]);
      if (!isNaN(rMin) && v < rMin) return false;
      if (!isNaN(rMax) && v > rMax) return false;
    }
    return true;
  });

  buildStats();
  updateCharts();
  buildTable();
}

function clearFilters() {
  document.getElementById('search-input').value = '';
  categoricalCols.slice(0, 3).forEach(col => {
    const el = document.getElementById('filter-' + col);
    if (el) el.value = '';
  });
  const rMin = document.getElementById('range-min');
  const rMax = document.getElementById('range-max');
  if (rMin) rMin.value = '';
  if (rMax) rMax.value = '';
  filteredData = [...rawData];
  buildStats();
  updateCharts();
  buildTable();
}

function buildStats() {
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = '';

  const classes = ['c1','c2','c3','c4','c5'];
  const cards = [];

  // Total rows
  cards.push({ label: 'TOTAL ROWS', value: filteredData.length.toLocaleString(), sub: `จาก ${rawData.length.toLocaleString()} ทั้งหมด` });

  // Stats for numeric cols
  numericCols.slice(0, 4).forEach(col => {
    const vals = filteredData.map(r => parseFloat(r[col])).filter(v => !isNaN(v));
    if (vals.length === 0) return;
    const sum = vals.reduce((a, b) => a + b, 0);
    const avg = sum / vals.length;
    const max = Math.max(...vals);
    const min = Math.min(...vals);
    cards.push({ label: 'SUM — ' + col, value: formatNum(sum), sub: 'ผลรวม' });
    cards.push({ label: 'AVG — ' + col, value: formatNum(avg), sub: `Min: ${formatNum(min)} · Max: ${formatNum(max)}` });
  });

  cards.slice(0, 5).forEach((c, i) => {
    const div = document.createElement('div');
    div.className = `stat-card ${classes[i]} fade-in`;
    div.innerHTML = `<div class="stat-label">${c.label}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-sub">${c.sub}</div>`;
    grid.appendChild(div);
  });
}

function buildCharts() {
  const grid = document.getElementById('charts-grid');
  grid.innerHTML = '';
  charts = {};

  // Chart 1: Bar chart for first categorical col
  if (categoricalCols.length > 0 && numericCols.length > 0) {
    const catCol = categoricalCols[0];
    const numCol = numericCols[0];
    const card = makeChartCard('bar-chart', 'BAR CHART', catCol + ' vs ' + numCol,
      `<select class="col-select" id="bar-cat-sel">${categoricalCols.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}</select>
       <select class="col-select" id="bar-num-sel">${numericCols.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}</select>`
    );
    grid.appendChild(card);
    document.getElementById('bar-cat-sel').addEventListener('change', updateCharts);
    document.getElementById('bar-num-sel').addEventListener('change', updateCharts);

    const ctx = document.getElementById('bar-chart').getContext('2d');
    charts['bar'] = new Chart(ctx, {
      type: 'bar',
      data: { labels: [], datasets: [{ data: [], backgroundColor: 'rgba(0,229,255,0.7)', borderColor: '#00e5ff', borderWidth: 1, borderRadius: 4 }] },
      options: chartOpts('bar')
    });
  }

  // Chart 2: Line chart for numeric over index
  if (numericCols.length > 0) {
    const card = makeChartCard('line-chart', 'LINE CHART', 'แนวโน้มข้อมูล',
      `<select class="col-select" id="line-col-sel">${numericCols.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}</select>`
    );
    grid.appendChild(card);
    document.getElementById('line-col-sel').addEventListener('change', updateCharts);

    const ctx = document.getElementById('line-chart').getContext('2d');
    charts['line'] = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ data: [], borderColor: '#7c3aed', backgroundColor: 'rgba(124,58,237,0.1)', fill: true, tension: 0.4, pointRadius: 2 }] },
      options: chartOpts('line')
    });
  }

  // Chart 3: Pie / donut for categorical
  if (categoricalCols.length > 0) {
    const card = makeChartCard('pie-chart', 'DONUT CHART', 'สัดส่วน',
      `<select class="col-select" id="pie-col-sel">${categoricalCols.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}</select>`
    );
    grid.appendChild(card);
    document.getElementById('pie-col-sel').addEventListener('change', updateCharts);

    const ctx = document.getElementById('pie-chart').getContext('2d');
    charts['pie'] = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: [], datasets: [{ data: [], backgroundColor: ['#00e5ff','#7c3aed','#f59e0b','#10b981','#ef4444','#ec4899','#3b82f6','#8b5cf6'], borderWidth: 0 }] },
      options: { ...chartOpts('pie'), cutout: '65%' }
    });
  }

  // Chart 4: Scatter for 2 numeric cols
  if (numericCols.length >= 2) {
    const card = makeChartCard('scatter-chart', 'SCATTER PLOT', numericCols[0] + ' vs ' + numericCols[1],
      `<select class="col-select" id="sc-x-sel">${numericCols.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}</select>
       <select class="col-select" id="sc-y-sel">${numericCols.map((c,i)=>`<option value="${escHtml(c)}" ${i===1?'selected':''}>${escHtml(c)}</option>`).join('')}</select>`
    );
    grid.appendChild(card);
    document.getElementById('sc-x-sel').addEventListener('change', updateCharts);
    document.getElementById('sc-y-sel').addEventListener('change', updateCharts);

    const ctx = document.getElementById('scatter-chart').getContext('2d');
    charts['scatter'] = new Chart(ctx, {
      type: 'scatter',
      data: { datasets: [{ data: [], backgroundColor: 'rgba(245,158,11,0.6)', pointRadius: 4 }] },
      options: chartOpts('scatter')
    });
  }

  updateCharts();
}

function makeChartCard(canvasId, title, subtitle, controls) {
  const div = document.createElement('div');
  div.className = 'chart-card fade-in';
  div.innerHTML = `
    <div class="chart-header">
      <div class="chart-title">${title}</div>
      <div style="display:flex;gap:6px;align-items:center">${controls || ''}</div>
    </div>
    <div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
  return div;
}

function updateCharts() {
  // Bar
  if (charts['bar']) {
    const catCol = document.getElementById('bar-cat-sel')?.value || categoricalCols[0];
    const numCol = document.getElementById('bar-num-sel')?.value || numericCols[0];
    const grouped = {};
    filteredData.forEach(r => {
      const k = r[catCol] || '(ว่าง)';
      const v = parseFloat(r[numCol]) || 0;
      grouped[k] = (grouped[k] || 0) + v;
    });
    const sorted = Object.entries(grouped).sort((a,b) => b[1]-a[1]).slice(0, 15);
    charts['bar'].data.labels = sorted.map(([k]) => k);
    charts['bar'].data.datasets[0].data = sorted.map(([,v]) => v);
    charts['bar'].update();
  }

  // Line
  if (charts['line']) {
    const col = document.getElementById('line-col-sel')?.value || numericCols[0];
    const step = Math.max(1, Math.floor(filteredData.length / 80));
    const sampled = filteredData.filter((_, i) => i % step === 0).slice(0, 80);
    charts['line'].data.labels = sampled.map((_, i) => i * step);
    charts['line'].data.datasets[0].data = sampled.map(r => parseFloat(r[col]) || 0);
    charts['line'].update();
  }

  // Pie
  if (charts['pie']) {
    const col = document.getElementById('pie-col-sel')?.value || categoricalCols[0];
    const count = {};
    filteredData.forEach(r => { const k = r[col] || '(ว่าง)'; count[k] = (count[k] || 0) + 1; });
    const sorted = Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);
    charts['pie'].data.labels = sorted.map(([k])=>k);
    charts['pie'].data.datasets[0].data = sorted.map(([,v])=>v);
    charts['pie'].update();
  }

  // Scatter
  if (charts['scatter']) {
    const xCol = document.getElementById('sc-x-sel')?.value || numericCols[0];
    const yCol = document.getElementById('sc-y-sel')?.value || numericCols[1];
    const step = Math.max(1, Math.floor(filteredData.length / 200));
    const pts = filteredData.filter((_,i)=>i%step===0).map(r=>({
      x: parseFloat(r[xCol]), y: parseFloat(r[yCol])
    })).filter(p=>!isNaN(p.x)&&!isNaN(p.y));
    charts['scatter'].data.datasets[0].data = pts;
    charts['scatter'].update();
  }
}

function chartOpts(type) {
  const base = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: type === 'pie', labels: { color: '#64748b', font: { size: 11 } } },
      tooltip: {
        backgroundColor: '#111520',
        borderColor: '#1e2640',
        borderWidth: 1,
        titleColor: '#e2e8f0',
        bodyColor: '#64748b'
      }
    },
    animation: { duration: 600 }
  };
  if (type !== 'pie') {
    base.scales = {
      x: { ticks: { color: '#64748b', maxRotation: 45, font: { size: 10 } }, grid: { color: '#1e2640' } },
      y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e2640' } }
    };
  }
  return base;
}

function buildTable() {
  const thead = document.getElementById('table-head');
  const tbody = document.getElementById('table-body');
  document.getElementById('table-count').textContent = `${filteredData.length.toLocaleString()} แถว`;

  thead.innerHTML = `<tr>${headers.map((h, i) =>
    `<th onclick="sortTable(${i})">${escHtml(h)} <span class="sort-indicator" id="sort-${i}">↕</span></th>`
  ).join('')}</tr>`;

  renderTableBody();
}

function renderTableBody() {
  const tbody = document.getElementById('table-body');
  const display = filteredData.slice(0, 500);
  tbody.innerHTML = display.map(row =>
    `<tr>${headers.map(h => `<td title="${escHtml(String(row[h]))}">${escHtml(String(row[h]))}</td>`).join('')}</tr>`
  ).join('');
  if (filteredData.length > 500) {
    tbody.innerHTML += `<tr><td colspan="${headers.length}" style="text-align:center;color:var(--muted);padding:16px;font-size:0.8rem">
      แสดง 500 แถวแรก จาก ${filteredData.length.toLocaleString()} แถวทั้งหมด</td></tr>`;
  }
}

function sortTable(colIdx) {
  const col = headers[colIdx];
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }

  document.querySelectorAll('.sort-indicator').forEach(el => el.textContent = '↕');
  document.getElementById('sort-' + colIdx).textContent = sortDir === 1 ? '↑' : '↓';

  filteredData.sort((a, b) => {
    const av = a[col], bv = b[col];
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return (an - bn) * sortDir;
    return av.localeCompare(bv) * sortDir;
  });
  renderTableBody();
}

function resetDashboard() {
  rawData = []; filteredData = []; headers = [];
  numericCols = []; categoricalCols = [];
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
  document.getElementById('dashboard').classList.remove('active');
  uploadZone.style.display = '';
  document.getElementById('status-text').textContent = 'AWAITING DATA';
  document.getElementById('status-text').className = 'status-badge';
  fileInput.value = '';
}

function formatNum(n) {
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n % 1 === 0 ? n.toLocaleString() : n.toFixed(2);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
